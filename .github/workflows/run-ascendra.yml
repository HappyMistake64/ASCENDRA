name: Run ASCENDRA

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Safe ASCENDRA mode"
        required: true
        default: "synthetic-demo"
        type: choice
        options:
          - synthetic-demo
          - agent-help
          - v4-verify

permissions:
  contents: read

concurrency:
  group: run-ascendra-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install sandbox and Python
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap python3-venv
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          python3 -m venv .venv
          .venv/bin/python -m pip install .

      - name: Run offline tests
        run: |
          mkdir -p run-results
          .venv/bin/python -m unittest discover -s tests -v 2>&1 | tee run-results/tests.log

      - name: Run selected ASCENDRA mode
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          case "$MODE" in
            synthetic-demo)
              .venv/bin/ascendra demo --output run-results/demo 2>&1 | tee run-results/run.log
              ;;
            agent-help)
              .venv/bin/ascendra-agent --help 2>&1 | tee run-results/run.log
              ;;
            v4-verify)
              if [[ -f .ascendra/method-search-lcb-v4-pilot/manifest.json ]]; then
                .venv/bin/python -m ascendra.method_research_v4 verify 2>&1 | tee run-results/run.log
              else
                echo "No committed V4 pilot manifest is present; refusing to fabricate evidence." | tee run-results/run.log
              fi
              ;;
            *)
              echo "Unsupported mode: $MODE" >&2
              exit 2
              ;;
          esac

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ascendra-run-${{ github.run_id }}
          path: run-results/
          if-no-files-found: warn
          retention-days: 14
