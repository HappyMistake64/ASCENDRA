name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 and sandbox tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install sandbox and Python prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap python3-venv
          # Ubuntu 24.04 restricts unprivileged namespaces through AppArmor.
          # This setting applies only to this disposable GitHub-hosted runner.
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          /usr/bin/python3 --version
          bwrap --version

      - name: Install pinned browser verification runtime
        run: |
          node --version
          browser_runtime="$RUNNER_TEMP/ascendra-browser"
          mkdir -p "$browser_runtime"
          npm install --prefix "$browser_runtime" --save-exact playwright@1.64.1
          sudo mkdir -p /usr/local/share/ascendra-browsers
          sudo chown "$(id -u):$(id -g)" /usr/local/share/ascendra-browsers
          export PLAYWRIGHT_BROWSERS_PATH=/usr/local/share/ascendra-browsers
          "$browser_runtime/node_modules/.bin/playwright" install --with-deps chromium
          export ASCENDRA_PLAYWRIGHT_PACKAGE="$browser_runtime/package.json"
          chromium_path=$(node -e 'const {createRequire}=require("node:module"); const r=createRequire(process.env.ASCENDRA_PLAYWRIGHT_PACKAGE); process.stdout.write(r("playwright").chromium.executablePath())')
          test -x "$chromium_path"
          echo "ASCENDRA_PLAYWRIGHT_PACKAGE=$ASCENDRA_PLAYWRIGHT_PACKAGE" >> "$GITHUB_ENV"
          echo "ASCENDRA_CHROMIUM=$chromium_path" >> "$GITHUB_ENV"

      - name: Verify that the OS sandbox really works
        run: |
          bwrap --die-with-parent --unshare-all --cap-drop ALL \
            --ro-bind / / --proc /proc --dev /dev --tmpfs /tmp \
            -- /usr/bin/python3 -I -c 'print("Isolated Python execution succeeded")'

      - name: Build and install the package
        run: |
          /usr/bin/python3 -m venv .venv
          .venv/bin/python -m pip install .

      - name: Run the complete offline test suite
        run: |
          mkdir -p ci-results
          .venv/bin/python -m unittest discover -s tests -v 2>&1 | tee ci-results/unittest.log

      - name: Run independent browser acceptance tests
        run: node --test tests/test_browser_verify.mjs 2>&1 | tee ci-results/browser.log

      - name: Verify installed command entry points
        run: |
          repository="$PWD"
          cd "$RUNNER_TEMP"
          "$repository/.venv/bin/ascendra" --help
          "$repository/.venv/bin/ascendra-agent" --help
          "$repository/.venv/bin/ascendra-studio" --help
          "$repository/.venv/bin/ascendra-executor" --help
          "$repository/.venv/bin/ascendra-evaluate" --help
          "$repository/.venv/bin/ascendra-continuation" --help

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-test-results
          path: ci-results/
          if-no-files-found: ignore
          retention-days: 14
