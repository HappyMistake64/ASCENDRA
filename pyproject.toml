[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "ascendra"
version = "0.6.0"
description = "Local-first measurable recursive agent improvement laboratory"
requires-python = ">=3.11"
[project.scripts]
ascendra = "ascendra.cli:main"
ascendra-agent = "ascendra.capability_cli:main"
ascendra-studio = "ascendra.studio_cli:main"
ascendra-executor = "ascendra.execution_cli:main"
ascendra-execution-bridge = "ascendra.execution_bridge:main"
ascendra-evaluate = "ascendra.evaluation_cli:main"
ascendra-continuation = "ascendra.continuation_worker:main"
[tool.setuptools.packages.find]
where = ["."]
include = ["ascendra*"]

[tool.setuptools.package-data]
ascendra = ["*.mjs"]
